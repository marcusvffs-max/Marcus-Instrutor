<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12345a">
  <meta name="description" content="Lista de aulas do usuário - Marcus Instrutor">
  <title>Minhas aulas | Marcus Instrutor</title>
  <link rel="stylesheet" href="instrutor.css?v=1">
  <link rel="stylesheet" href="usuario.css?v=1">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">MI</div>
        <div><h1>Marcus Instrutor</h1><p>Área do usuário</p></div>
      </div>
      <div class="account-area">
        <span id="nomeUsuario">Carregando perfil...</span>
        <button id="btnSair" class="button button-outline" type="button">Sair</button>
      </div>
    </header>

    <main class="content">
      <section class="intro">
        <span class="eyebrow">CONSULTA DE AULAS</span>
        <h2>Minhas aulas agendadas</h2>
        <p>Aqui você pode visualizar as aulas vinculadas ao seu acesso.</p>
      </section>

      <section class="summary-grid user-summary" aria-label="Resumo das aulas">
        <article class="summary-card">
          <span>Total de aulas agendadas</span>
          <strong id="totalAulas">—</strong>
        </article>
      </section>

      <section class="panel result-panel">
        <div class="result-heading">
          <div>
            <h3>Lista de aulas</h3>
            <p id="atualizadoEm">Carregando sua agenda...</p>
          </div>
          <button id="btnAtualizar" class="button button-outline" type="button">Atualizar</button>
        </div>
        <div id="listaAulas" aria-live="polite">
          <div class="empty-state">Carregando aulas...</div>
        </div>
      </section>
      <p id="mensagem" class="message" role="status" aria-live="polite"></p>
    </main>
    <footer>Marcus Instrutor · Área restrita</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1"></script>
  <script src="usuario.js?v=1"></script>
</body>
</html>
