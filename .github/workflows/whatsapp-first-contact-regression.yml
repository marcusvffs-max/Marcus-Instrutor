name: Production readiness source checks

on:
  push:
    branches:
      - qa/production-readiness-integration-20261125
  pull_request:

jobs:
  static-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check WhatsApp first-contact routing
        run: node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const source = readFileSync("supabase/functions/whatsapp-webhook/index.ts", "utf8");
          assert.ok(source.includes("let isNewConversation = false"));
          assert.ok(source.includes("isNewConversation = Boolean(created && !createError)"));
          assert.ok(source.includes('if (isNewConversation || conversationStatus === "aguardando")'));
          assert.ok(source.includes('status: "aguardando_escolha"'));
          assert.ok(source.includes("sendInitialMenuSelection(supabase, conversation.id, phone)"));
          assert.ok(source.includes('assistant_activation_reason: isNewConversation ? "new_contact_first_message" : "legacy_aguardando"'));
          assert.ok(source.includes('messageError?.code === "23505"'));
          assert.ok(source.includes('conversationStatus === "atendimento_humano"'));
          assert.ok(source.includes("ai_paused_until"));
          console.log("OK: WhatsApp first-contact routing.");
          NODE
      - name: Check rental-credit RLS migration
        run: node test-student-rental-credit-rls-repair.mjs
      - name: Check partner module regressions
        run: node --test scripts/test-partner-module.mjs
